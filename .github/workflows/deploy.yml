# GitHub Pages 部署工作流（图纸 §4.4）
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"
# 2026-08-13 补链：机器人（GITHUB_TOKEN）的数据提交不会触发 push 事件，
# 每日数据更新靠 workflow_run 监听 Fetch Data 完成后接力部署，不再依赖人工推送顺带点燃。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 接力时只在抓取成功才部署；push/手动触发不受条件影响
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # action 升到 Node24 运行时以消除 Node20 deprecated 警告；
      #  构建 node-version 仍钉 20，与本地 .nvmrc 20.19.6 对齐（不改变构建行为）
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # public/data/ 已被 Vite 自动复制到 dist/data/
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
