# 数据抓取工作流（图纸 §4）
# 低频静态数据每天 1 次全量抓取（~30 min，远低于 2000 min/月免费额度）
# 实时比分不进 Actions——前端浏览器直连 ESPN site.api（CORS 已验证）
name: Fetch Data

on:
  schedule:
    - cron: '0 23 * * 0,3,5,6' # 每周四/六/日/一早上 07:00（北京时间；= UTC 周三/五/六/日 23:00），赛后次日晨抓；周末比赛多，周日加抓一次，仍低频
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # action 升到 Node24 运行时以消除 Node20 deprecated 警告；
      #  job 的 node-version 仍钉 20，与本地 .nvmrc 20.19.6 对齐（抓取脚本零依赖，20/24 均可跑）
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Fetch ESPN core (teams/players/leaders)
        run: node scripts/fetch-espn-core.js

      # 队徽本地化：core 生成 teams.json（含新赛季升班马）后补下载缺失队徽 PNG。
      # fetch-logos.js 幂等，只补缺失、跳过已存在，赛季切换升班马自动补图。
      - name: Fetch team logos (localize crests)
        run: node scripts/fetch-logos.js

      # Understat (xG) 2026-08-18 合规舍弃：不再获取/展示 xG，链路保留（fetch-understat.js / build-team-map.js 文件未删）。
      # 恢复时重新启用下面两步即可：
      # - name: Fetch Understat (xG)
      #   run: node scripts/fetch-understat.js
      # - name: Rebuild team-name map
      #   run: node scripts/build-team-map.js

      - name: Fetch ESPN scores + compute standings
        run: node scripts/fetch-espn-scores.js

      - name: Fetch transfers (career history)
        run: node scripts/fetch-transfers.js

      # 条件提交：脚本层 writeJsonIfChanged 已保证数据无变化时文件不动，
      # 这里 git diff 为空则跳过 commit（抓取间隔内数据不变是常态）
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/logos
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 每日抓取更新 $(date -u +%F)"
            git push
          fi
