<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收藏夹页重设计 · 样式稿 B′（第二批）</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #1a2030; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  h1 { color: #e2e8f0; font-size: 16px; font-weight: 600; }
  p.note { color: #94a3b8; font-size: 12px; max-width: 420px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<h1>收藏夹页 · 单行卡 B′（375px 模拟）</h1>
<p class="note">队徽/星标 + 名字 + 联赛徽章 + 紧凑钮「日历 / 删除」；徽章按钮永远完整，名字超长截断；无编号遗留条目只显示名字 + 徽章。</p>

<div style="width:375px;max-width:100%;background:#0b0f1a;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;">
  <!-- 页标题（归位联赛页统一样式） -->
  <div style="margin-bottom:12px;">
    <div style="color:#fff;font-size:20px;font-weight:600;font-family:'Arial Narrow',system-ui,sans-serif;letter-spacing:.03em;">我的收藏</div>
  </div>
  <!-- 页签：暗色圆角钮 + 中性下划线 -->
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <div style="padding:6px 14px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;box-shadow:inset 0 -2px 0 rgba(255,255,255,.45);">球队 (3)</div>
    <div style="padding:6px 14px;border-radius:8px;color:#94a3b8;font-size:13px;">球员 (2)</div>
  </div>
  <!-- 球队行：阿森纳 -->
  <div style="background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;border-radius:50%;background:#EF0107;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;flex:none;">ARS</div>
    <span style="color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">阿森纳</span>
    <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(61,25,91,.55);color:#c4b5fd;flex:none;">英超</span>
    <span style="margin-left:auto;display:flex;gap:6px;flex:none;">
      <span style="padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;font-size:11px;">日历</span>
      <span style="padding:5px 9px;border-radius:6px;color:#fb7185;font-size:11px;border:1px solid rgba(251,113,133,.25);">删除</span>
    </span>
  </div>
  <!-- 球队行：托特纳姆热刺（6 字） -->
  <div style="background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;border-radius:50%;background:#13294B;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;flex:none;">TOT</div>
    <span style="color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">托特纳姆热刺</span>
    <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(61,25,91,.55);color:#c4b5fd;flex:none;">英超</span>
    <span style="margin-left:auto;display:flex;gap:6px;flex:none;">
      <span style="padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cbd5e1;font-size:11px;">日历</span>
      <span style="padding:5px 9px;border-radius:6px;color:#fb7185;font-size:11px;border:1px solid rgba(251,113,133,.25);">删除</span>
    </span>
  </div>
  <!-- 球队行：无编号遗留条目（降级渲染：无队徽无按钮） -->
  <div style="background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">
    <span style="color:#e2e8f0;font-size:14px;">多特蒙德</span>
    <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(211,0,0,.35);color:#fca5a5;">德甲</span>
  </div>
  <!-- 球员区 -->
  <div style="color:#64748b;font-size:11px;margin:14px 0 8px;">↓ 球员页签</div>
  <div style="background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;border-radius:50%;background:rgba(250,204,21,.15);display:flex;align-items:center;justify-content:center;color:#facc15;font-size:12px;flex:none;">★</div>
    <span style="color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">哈兰德</span>
    <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(61,25,91,.55);color:#c4b5fd;flex:none;">英超</span>
    <span style="margin-left:auto;">
      <span style="padding:5px 9px;border-radius:6px;color:#fb7185;font-size:11px;border:1px solid rgba(251,113,133,.25);">删除</span>
    </span>
  </div>
  <!-- 球员行：英文长名截断示意 -->
  <div style="background:#131a2b;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:8px;">
    <div style="width:24px;height:24px;border-radius:50%;background:rgba(250,204,21,.15);display:flex;align-items:center;justify-content:center;color:#facc15;font-size:12px;flex:none;">★</div>
    <span style="color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">Bukayo Sarsfield Longname-Example</span>
    <span style="font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(61,25,91,.55);color:#c4b5fd;flex:none;">英超</span>
    <span style="margin-left:auto;">
      <span style="padding:5px 9px;border-radius:6px;color:#fb7185;font-size:11px;border:1px solid rgba(251,113,133,.25);">删除</span>
    </span>
  </div>
</div>

</body>
</html>
